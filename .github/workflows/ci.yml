name: CI/CD

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      # Use localhost (127.0.0.1) and the published port so the runner can reliably connect
      # (using the service hostname can sometimes hit DNS resolution races in the runner)
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for Postgres
        run: |
          echo "Waiting for Postgres to accept connections on 127.0.0.1:5432..."
          for i in $(seq 1 60); do
            if bash -c 'cat < /dev/tcp/127.0.0.1/5432' >/dev/null 2>&1; then
              echo "Postgres is accepting connections"
              break
            fi
            sleep 1
          done
          # final check
          if ! bash -c 'cat < /dev/tcp/127.0.0.1/5432' >/dev/null 2>&1; then
            echo "Postgres did not become ready in time" >&2
            exit 1
          fi

      - name: Run tests with coverage (fail if coverage < 100%)
        run: |
          # verbose output helps diagnose stalls: list tests as they run
          # generate XML and HTML reports so they can be uploaded as artifacts
          pytest --maxfail=1 --disable-warnings -vv \
            --cov=app --cov-fail-under=100 \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/**
            .coverage

  docker:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ashikap/fastapi-calculator:latest

      - name: Save docker image summary
        run: |
          # the image reference we pushed
          echo "image=ashikap/fastapi-calculator:latest" > docker-image-info.txt
          # build-push-action reliably outputs digest
          echo "digest=${{ steps.build.outputs.digest }}" >> docker-image-info.txt
          cat docker-image-info.txt

      - name: Upload docker build summary
        uses: actions/upload-artifact@v4
        with:
          name: docker-build-summary
          path: docker-image-info.txt
