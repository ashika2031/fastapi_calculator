name: CI/CD
on: [push, pull_request]
jobs:
  unit:
    name: Unit tests (fast)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./test_fast.db
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install minimal runtime + test dependencies
        run: |
          python -m pip install --upgrade pip
          # install only the runtime packages needed by unit tests to keep this step fast
          pip install --prefer-binary -q fastapi pydantic sqlalchemy passlib[bcrypt] bcrypt httpx pytest pytest-cov

      - name: Run unit tests
        run: |
          pytest tests/unit -q -vv --maxfail=1 --disable-warnings \
            --cov=app --cov-fail-under=80 --cov-report=term-missing

  integration:
    name: Integration tests (Postgres)
    runs-on: ubuntu-latest
    needs: unit

    services:
      postgres:
        # use a smaller alpine image to speed container pull/start
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # prefer binary wheels where available to avoid slow builds
          pip install --prefer-binary -r requirements.txt -q

      - name: Wait for Postgres (TCP)
        run: |
          echo "Waiting for Postgres to accept connections on 127.0.0.1:5432..."
          for i in $(seq 1 30); do
            if bash -c 'cat < /dev/tcp/127.0.0.1/5432' >/dev/null 2>&1; then
              echo "Postgres is accepting connections"
              break
            fi
            sleep 1
          done
          if ! bash -c 'cat < /dev/tcp/127.0.0.1/5432' >/dev/null 2>&1; then
            echo "Postgres did not become ready in time" >&2
            exit 1
          fi

      - name: Run tests with coverage (integration)
        run: |
          pytest -q -vv --maxfail=1 --disable-warnings \
            --cov=app --cov-fail-under=100 --cov-report=term-missing \
            --cov-report=xml:coverage.xml --cov-report=html

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/**
            .coverage

  docker:
    needs: integration
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ashikap/fastapi-calculator:latest

      - name: Save docker image summary
        run: |
          # the image reference we pushed
          echo "image=ashikap/fastapi-calculator:latest" > docker-image-info.txt
          # build-push-action reliably outputs digest
          echo "digest=${{ steps.build.outputs.digest }}" >> docker-image-info.txt
          cat docker-image-info.txt

      - name: Upload docker build summary
        uses: actions/upload-artifact@v4
        with:
          name: docker-build-summary
          path: docker-image-info.txt
