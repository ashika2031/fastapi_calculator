name: CI Fast (unit-only)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: sqlite:///./test_fast.db

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install minimal runtime + test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -q fastapi pydantic sqlalchemy passlib[bcrypt] bcrypt httpx pytest pytest-cov

      - name: Run unit tests (fast)
        run: |
          # run only unit tests for a faster feedback loop
          pytest tests/unit -q -vv --maxfail=1 --disable-warnings \
            --cov=app --cov-fail-under=80 --cov-report=term-missing
